<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punjabi Angithi | Micro Drama Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110704; --coal:#1d0e08; --ember:#ff5a1f; --gold:#ffb627; --terra:#b5472a; --cream:#fff1d6; --chilli:#d1202f;
  --ink:#fff1d6; --muted:#d9b99a;
  --serif:'Yatra One',Georgia,serif; --sans:'Hind',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 700px at 80% -10%,#3a1406 0%,transparent 60%),radial-gradient(900px 600px at -10% 40%,#2a0d05 0%,transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
main{position:relative;z-index:2}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:linear-gradient(#110704ee,#11070400);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:12px}
#logoBox{height:46px;min-width:46px;display:flex;align-items:center}
#logoBox img{height:46px;width:auto;display:block;border-radius:6px}
.wordmark{font-family:var(--serif);font-size:24px;letter-spacing:.5px;color:var(--gold);text-shadow:0 0 18px #ff5a1f88;line-height:1}
.wordmark small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-top:3px;text-shadow:none}
.navlinks{display:flex;gap:22px;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.navlinks a{text-decoration:none}.navlinks a:hover{color:var(--gold)}

/* hero */
.hero{min-height:92vh;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:40px 0 70px}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);border:1px solid #ffb62755;padding:7px 14px;border-radius:40px;background:#ffb6270f}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,7.4vw,104px);line-height:.98;margin:22px 0 18px;background:linear-gradient(180deg,#fff3c4 0%,var(--gold) 38%,var(--ember) 78%,var(--chilli) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px #ff5a1f55)}
.lead{font-size:20px;color:#f6dcbb;max-width:560px}
.cta{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.btn{border:0;padding:14px 26px;border-radius:50px;font-weight:700;letter-spacing:1px;font-size:15px;color:#1b0803;background:linear-gradient(135deg,var(--gold),var(--ember));box-shadow:0 10px 40px #ff5a1f66;transition:.25s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 50px #ff5a1faa}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid #ffb62788;box-shadow:none}
.pot{position:relative;display:flex;justify-content:center}
.pot svg{width:min(480px,92%);filter:drop-shadow(0 30px 60px #ff5a1f55)}
.steam path{fill:none;stroke:#fff3dd;stroke-linecap:round;stroke-width:7;opacity:0;animation:steam 4.2s ease-in infinite}
.steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.2s}.steam path:nth-child(4){animation-delay:.5s}.steam path:nth-child(5){animation-delay:3s}
@keyframes steam{0%{opacity:0;transform:translateY(40px) scaleY(.7)}25%{opacity:.55}100%{opacity:0;transform:translateY(-120px) scaleY(1.3)}}
.glowring{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.spice{position:absolute;font-size:34px;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 4px 10px #000a)}
@keyframes bob{50%{transform:translateY(-16px) rotate(8deg)}}

/* marquee */
.marquee{overflow:hidden;border-block:1px solid #ffb62733;background:linear-gradient(90deg,#b5472a33,#ffb62722,#b5472a33);padding:14px 0;transform:rotate(-1.2deg);margin:10px -2% 70px}
.marquee div{display:flex;gap:46px;white-space:nowrap;width:max-content;animation:slide 38s linear infinite;font-family:var(--serif);font-size:26px;color:var(--gold)}
.marquee i{color:var(--ember);font-style:normal}
@keyframes slide{to{transform:translateX(-50%)}}

section{padding:70px 0}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.6vw,58px);color:var(--cream);line-height:1.08;margin-bottom:14px}
h2 em{font-style:normal;color:var(--ember)}
.sub{color:var(--muted);max-width:720px;margin-bottom:34px;font-size:18px}
.goals{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.goal{padding:22px 18px;border-radius:18px;background:linear-gradient(160deg,#2a1209,#170a05);border:1px solid #ffb6272e;transition:.3s;position:relative;overflow:hidden}
.goal:hover{transform:translateY(-8px);border-color:var(--gold);box-shadow:0 18px 50px #ff5a1f44}
.goal b{display:block;font-size:34px;margin-bottom:6px}
.goal h4{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--gold);margin-bottom:4px}
.goal p{font-size:15px;color:#e8cba9;line-height:1.45}
.rules{counter-reset:r;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.rule{counter-increment:r;padding:22px 22px 22px 70px;position:relative;border-radius:16px;background:#ffffff08;border:1px solid #ffffff14;font-size:16px}
.rule:before{content:counter(r);position:absolute;left:18px;top:14px;font-family:var(--serif);font-size:42px;color:var(--ember);opacity:.9}

/* placards */
.placards{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;padding-top:30px}
.placard{position:relative;border:0;text-align:left;color:#fff;padding:0;background:none;transform-origin:50% -20px;transition:transform .45s cubic-bezier(.2,1.4,.4,1),filter .3s}
.placard:nth-child(1){transform:rotate(-2.4deg)}.placard:nth-child(2){transform:rotate(1.6deg)}.placard:nth-child(3){transform:rotate(-1.2deg)}.placard:nth-child(4){transform:rotate(2.2deg)}
.placard:hover{transform:rotate(0) translateY(-12px) scale(1.04);z-index:3}
.placard:before,.placard:after{content:"";position:absolute;top:-34px;width:2px;height:40px;background:#c9a56a;z-index:2}
.placard:before{left:22%;transform:rotate(14deg)}.placard:after{right:22%;transform:rotate(-14deg)}
.pc{position:relative;overflow:hidden;border-radius:12px;padding:26px 22px 24px;min-height:430px;display:flex;flex-direction:column;border:3px solid #ffffff22;box-shadow:0 24px 60px #000b, inset 0 0 0 6px #00000030}
.pc:hover{box-shadow:0 30px 90px var(--glow,#ff5a1f99), inset 0 0 0 6px #00000030}
.pc .no{font-family:var(--serif);font-size:96px;line-height:.8;opacity:.28;position:absolute;right:12px;top:10px}
.pc .fmt{font-size:11px;letter-spacing:3px;text-transform:uppercase;background:#00000044;border-radius:30px;padding:5px 11px;align-self:flex-start;margin-bottom:18px}
.pc h3{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.02;margin-bottom:10px;text-shadow:0 4px 18px #0008}
.pc .tag{font-size:16px;font-style:italic;opacity:.95;margin-bottom:16px}
.pc .int{font-size:14px;border-top:1px dashed #ffffff55;padding-top:12px;margin-top:auto;opacity:.95}
.pc .int b{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.75;margin-bottom:3px}
.pc .open{margin-top:14px;font-weight:700;letter-spacing:1px;font-size:14px}
.pc .wisps{position:absolute;left:0;right:0;bottom:0;height:60%;pointer-events:none;opacity:.5}
.pc .wisps i{position:absolute;bottom:-20px;width:46px;height:120px;border-radius:50%;background:radial-gradient(#ffffff55,transparent 70%);filter:blur(8px);animation:rise 5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-300px) scale(1.5);opacity:0}}
.p1 .pc{background:linear-gradient(150deg,#ffb347,#c4561a 55%,#2a8fa0);--glow:#ffb347aa}
.p2 .pc{background:linear-gradient(150deg,#ff3d6e,#8a0f33 60%,#ffc21a);--glow:#ff3d6eaa}
.p3 .pc{background:linear-gradient(150deg,#12384d,#071420 62%,#0e7a68);--glow:#3df0c4aa}
.p4 .pc{background:linear-gradient(150deg,#e8a317,#7a5410 60%,#5d8f3d);--glow:#e8a317aa}

/* release */
.rel{display:grid;gap:12px}
.relrow{display:grid;grid-template-columns:60px 1.2fr 3fr 1fr;gap:16px;align-items:center;padding:16px 20px;border-radius:14px;background:#ffffff08;border:1px solid #ffffff12}
.relrow b.n{font-family:var(--serif);font-size:34px;color:var(--ember);font-weight:400}
.relrow .drop{color:var(--gold);text-align:right;font-weight:600}
footer{padding:60px 0 120px;text-align:center;color:var(--muted);border-top:1px solid #ffb62722;margin-top:60px}
footer .wordmark{font-size:30px;margin-bottom:8px}

/* series overlay */
#ov{position:fixed;inset:0;z-index:50;overflow-y:auto;visibility:hidden;clip-path:circle(0% at 50% 50%);transition:clip-path .9s cubic-bezier(.7,0,.2,1),visibility 0s .9s;background:var(--sbg);color:var(--sink)}
#ov.open{visibility:visible;clip-path:circle(150% at var(--cx,50%) var(--cy,50%));transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
#ov .decor{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.t1{--sbg:radial-gradient(900px 700px at 15% 10%,#6a3a0e 0%,transparent 60%),radial-gradient(900px 700px at 90% 90%,#0b4a58 0%,transparent 60%),#150c08;--a:#ffb347;--b:#5ec8d8;--sink:#fff0d9;--card:#2a190d}
.t2{--sbg:radial-gradient(900px 700px at 80% 0%,#a0123e 0%,transparent 60%),radial-gradient(800px 600px at 0% 100%,#7a4b00 0%,transparent 60%),#2a0710;--a:#ffc21a;--b:#ff3d6e;--sink:#fff0e0;--card:#450c1c}
.t3{--sbg:radial-gradient(900px 700px at 20% 0%,#0c3a4a 0%,transparent 60%),radial-gradient(800px 600px at 100% 100%,#073a33 0%,transparent 60%),#071420;--a:#3df0c4;--b:#ff4d4d;--sink:#e3fff8;--card:#0c2434}
.t4{--sbg:radial-gradient(900px 700px at 80% 10%,#6b4d0e 0%,transparent 60%),radial-gradient(900px 600px at 0% 90%,#2d4a1b 0%,transparent 60%),#2b2010;--a:#e8a317;--b:#8bc96a;--sink:#fff3d2;--card:#3b2d16}
.sv{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 24px 120px}
.sbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 0;background:#000000b8;backdrop-filter:blur(10px);margin:0 -24px;padding:14px 24px;border-bottom:1px solid #ffffff14}
.back{border:1px solid var(--a);background:#00000044;color:var(--sink);padding:10px 20px;border-radius:40px;font-weight:600;letter-spacing:1px}
.back:hover{background:var(--a);color:#111}
.sbar .nm{font-family:var(--serif);color:var(--a);font-size:20px}
.shead{padding:30px 0 20px;position:relative}
.shead .ghost{position:absolute;right:-10px;top:-20px;font-family:var(--serif);font-size:min(36vw,380px);line-height:.8;color:var(--a);opacity:.09;pointer-events:none}
.shead .fm{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:7px 14px;border-radius:30px;border:1px solid var(--a);color:var(--a);background:#00000033}
.shead h2{font-size:clamp(46px,8vw,118px);line-height:.95;color:var(--sink);text-shadow:0 0 50px var(--a);margin-bottom:10px}
.shead .tg{font-size:22px;font-style:italic;color:var(--a);max-width:760px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:34px 0 18px}
.tcard{padding:20px;border-radius:16px;background:var(--card);border:1px solid #ffffff1a;border-top:3px solid var(--a)}
.tcard b{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--a);margin-bottom:6px}
.dirn{padding:24px 28px;border-radius:18px;border-left:5px solid var(--b);background:#ffffff0c;margin-bottom:22px}
.dirn b{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--b);display:block;margin-bottom:6px}
.cast{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.cast span{padding:9px 16px;border-radius:12px;background:var(--card);border:1px solid #ffffff1c;font-size:15px}
.lab{font-family:var(--serif);font-size:30px;color:var(--a);margin:44px 0 16px;display:flex;align-items:center;gap:14px}
.lab:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--a),transparent)}

/* glider */
.glider{position:relative}
.viewport{overflow:hidden;border-radius:22px;touch-action:pan-y}
.track{display:flex;transition:transform .7s cubic-bezier(.65,0,.25,1)}
.ep{min-width:100%;padding:34px 34px 30px;border-radius:22px;background:linear-gradient(145deg,var(--card),#00000066);border:1px solid #ffffff1c;position:relative;overflow:hidden;opacity:.35;transform:scale(.96);transition:.7s}
.ep.on{opacity:1;transform:scale(1)}
.ep:before{content:"";position:absolute;inset:-40% -20% auto auto;width:520px;height:520px;background:radial-gradient(var(--tint),transparent 65%);opacity:.28;filter:blur(20px)}
.ep .en{font-family:var(--serif);font-size:clamp(90px,16vw,200px);line-height:.8;position:absolute;right:20px;top:14px;color:var(--tint);opacity:.16}
.ep .kick{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--tint)}
.ep h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.4vw,54px);line-height:1.04;margin:6px 0 22px;position:relative;max-width:80%}
.row{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:14px 0;border-top:1px dashed #ffffff22;position:relative}
.row .k{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--tint);padding-top:4px}
.row .v{font-size:18px}
.row.ang .k:before{content:"♨ "}
.cliff{margin-top:22px;padding:20px 22px;border-radius:14px;background:repeating-linear-gradient(-45deg,#00000055 0 14px,#0000003a 14px 28px);border:1px solid var(--b);position:relative;animation:throb 2.6s ease-in-out infinite}
@keyframes throb{50%{box-shadow:0 0 36px -4px var(--b)}}
.cliff b{display:inline-block;font-size:11px;letter-spacing:4px;text-transform:uppercase;background:var(--b);color:#111;padding:4px 10px;border-radius:4px;margin-bottom:8px}
.ctrl{display:flex;align-items:center;gap:18px;margin-top:22px}
.arrow{width:54px;height:54px;border-radius:50%;border:1px solid var(--a);background:#00000055;color:var(--a);font-size:22px;transition:.2s;flex:none}
.arrow:hover:not(:disabled){background:var(--a);color:#111;transform:scale(1.1)}
.arrow:disabled{opacity:.25;cursor:default}
.rng{flex:1;position:relative}
.rng input{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:10px;background:linear-gradient(90deg,var(--a) var(--p,0%),#ffffff22 var(--p,0%));outline:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--a));box-shadow:0 0 22px var(--a);cursor:grab;border:3px solid #111}
.rng input::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--a);border:3px solid #111;cursor:grab}
.dots{display:flex;justify-content:space-between;margin-top:8px;padding:0 4px}
.dots button{background:none;border:0;color:#ffffff66;font-size:12px;letter-spacing:1px;padding:4px;transition:.2s}
.dots button.on{color:var(--a);transform:scale(1.4);font-weight:700}
.eplist{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.eplist button{padding:7px 12px;border-radius:30px;font-size:13px;background:#ffffff0d;border:1px solid #ffffff22;color:var(--sink)}
.eplist button.on{background:var(--a);color:#111;border-color:var(--a)}

/* decor items */
.petal{position:absolute;top:-30px;border-radius:60% 0 60% 0;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.ping{position:absolute;padding:8px 14px;border-radius:14px;background:#0c2434cc;border:1px solid #3df0c455;color:#3df0c4;font-size:13px;opacity:0;animation:pop 9s ease-in-out infinite}
@keyframes pop{0%,100%{opacity:0;transform:translateY(20px) scale(.9)}15%,60%{opacity:.85;transform:none}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#00000028 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
.rec{position:absolute;right:24px;top:80px;color:#ff4d4d;font-size:13px;letter-spacing:3px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.clock{position:absolute;left:50%;top:50%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed #ffb34733;opacity:.5}
.clock:before,.clock:after{content:"";position:absolute;left:50%;top:50%;width:3px;background:#ffb347;transform-origin:50% 100%}
.clock:before{height:30%;transform:translate(-50%,-100%) rotate(0deg);animation:hand 120s linear infinite}
.clock:after{height:20%;background:#5ec8d8;transform:translate(-50%,-100%) rotate(240deg)}
@keyframes hand{to{transform:translate(-50%,-100%) rotate(360deg)}}
.dustp{position:absolute;width:4px;height:4px;border-radius:50%;background:#f2d58a;opacity:.5;animation:drift linear infinite}
@keyframes drift{to{transform:translate(160px,-120px)}}
.grain{position:absolute;inset:0;opacity:.14;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* edit dock */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;padding:10px 14px;border-radius:50px;background:#1d0e08ee;border:1px solid #ffb62766;box-shadow:0 10px 40px #000a;backdrop-filter:blur(10px);max-width:96vw}
.dock button,.dock label.fb{border:1px solid #ffb62766;background:#00000055;color:var(--cream);padding:8px 16px;border-radius:30px;font-size:13px;font-weight:600;letter-spacing:.5px}
.dock button:hover,.dock label.fb:hover{background:var(--gold);color:#111}
.dock button.on{background:var(--gold);color:#111}
.dock .ed{display:none;gap:10px;align-items:center}
body.edit .dock .ed{display:flex;flex-wrap:wrap;justify-content:center}
.dock input[type=color]{width:30px;height:30px;border:0;background:none;padding:0}
.dock span.l{font-size:11px;color:var(--muted);letter-spacing:1px}
body.edit [contenteditable]{outline:1px dashed #ffb62799;outline-offset:3px;border-radius:4px;cursor:text}
body.edit [contenteditable]:focus{outline:2px solid var(--gold);background:#ffffff14}
.edtools{display:none;gap:8px;margin-top:14px}
body.edit .edtools{display:flex}
.edtools button{padding:8px 14px;border-radius:10px;border:1px dashed var(--a);background:#00000044;color:var(--sink);font-size:13px}
.hint{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:95;background:var(--gold);color:#111;padding:8px 18px;border-radius:30px;font-weight:700;font-size:13px}
body.edit .hint{display:block}

@media(max-width:980px){
  .hero{grid-template-columns:1fr;min-height:auto}.goals{grid-template-columns:repeat(2,1fr)}.rules{grid-template-columns:1fr}
  .placards{grid-template-columns:repeat(2,1fr)}.trio{grid-template-columns:1fr}.navlinks{display:none}
  .relrow{grid-template-columns:44px 1fr}.relrow .drop{text-align:left;grid-column:2}.row{grid-template-columns:1fr;gap:2px}.ep h3{max-width:100%}
}
@media(max-width:560px){.placards{grid-template-columns:1fr}.ep{padding:24px 18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

/* ===== Angithi brand layer (black, burnt orange, brass, cream) ===== */
:root{--bg:#0a0605;--ember:#c25b1f;--gold:#c9a45c;--cream:#f3e6cf;--ink:#f3e6cf;--muted:#c5ae8c;--flame:#ff8a1f;
  --serif:'Cormorant Garamond','Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
body{background:#0a0605;font-family:var(--sans);font-size:17px}
h1,h2,h3,h4,.wordmark,.goal h4,.pc h3,.lab,.shead h2,.ep h3,.sbar .nm,.rule:before,.relrow b.n,.pc .no,.ep .en,.shead .ghost{font-family:var(--serif)!important;font-weight:500}
h1{background:none;-webkit-background-clip:initial;color:var(--cream);filter:none;font-weight:500!important}
.eyebrow{color:var(--ember);border:0;background:none;letter-spacing:9px;font-size:14px;font-weight:700;padding:0}

purpose:{
  title:`Why we are making these`,
  text:`The aim is reach and a stronger brand image. Each story would work with no brand attached, and Angithi sits inside the plot so firmly that removing it breaks the episode. People should finish an episode hungry and curious, and only later notice they were never sold anything.`
},
goals:[
  ['📣','Reach','Shareable stories that people send to their own friends, family and neighbours.'],
  ['❤️','Brand love','Angithi as the taste of home, friendship and togetherness.'],
  ['🌶️','Masala range','The masala packs as a plot device, not a product shot.'],
  ['🛵','Home delivery','Every order is a scene people want to recreate, with offers carried in the caption.'],
  ['🏪','Franchise','New outlets opening on screen, so viewers want one in their own town.']
],
rulesTitle:`The rules we shoot by`,
rules:[
  `Take Angithi out and the episode breaks. If a scene still works without the matki, we rewrite it.`,
  `Nobody praises the food. The proof is behaviour: a hush when the lid comes off, someone lying to protect their order, someone crossing a city for it.`,
  `No logo held up to camera. The brand shows as a clay matki, a stamped bag, a rider's jacket, a contact name on a phone, a map pin.`,
  `Offers go in the caption and the pinned comment. Never in the last frame, which belongs to the cliffhanger.`,
  `Food gets two seconds of silence. Dialogue drops, steam rises. That is the only product shot we need.`,
  `Every episode ends on a question the viewer must answer by opening the next one.`
],
storiesTitle:`Choose a story`,
storiesSub:`Four placards, four worlds. Click one to enter its full set of episodes, characters and director's note.`,
releaseTitle:`How they roll out`,
releaseSub:`One series at a time, one episode a day, so each gets its own conversation before the next begins.`,
release:[
  ['1','Aaj Raat 8 Baje','The most shareable. Viewers tag their own group of friends under every episode.','8:00 pm daily'],
  ['2','Pehli Rasoi','Comedy that brings new viewers and sells the masala range and home delivery.','1:00 pm daily'],
  ['3','Galat Matki','A mystery people check each night. Works best as a daily ritual.','9:41 pm daily'],
  ['4','Mohalla Wars','Timed to the first franchise opening. Ends the week the outlet opens.','Starts 7 days before opening']
],
footer:{name:`Punjabi Angithi`,line:`Micro drama series · prepared exclusively for the Punjabi Angithi team`},
series:[
{
  theme:'t1',name:`Aaj Raat 8 Baje`,tag:`Four friends who stopped talking. One message from an unknown number. Four tables in four cities, one video call.`,
  fmt:`Two timelines`,drop:`8:00 pm daily`,
  intent:`Make every Angithi outlet feel like the place your friend group would reunite.`,
  role:`The place where four strangers became a family.`,
  job:`Outlet footfall and the franchise story.`,
  director:`Two timelines, cut on one sound: the hiss of a hot matki lid. College is warm, handheld, close on faces, amber light, a little grain. Tonight is cool and clean, four video tiles side by side, but every tile has the same terracotta pot in it. The pot is the only colour that crosses between worlds. We never explain the link. The viewer feels it.`,
  cast:[`Ishaan (Patna), the treasurer, now a product manager in Gurugram`,`Meher (Kochi), the sarcastic one, now remote in Dehradun`,`Dibya (Guwahati), the planner, now in Noida`,`Kabir (Ranchi), the joker who went quiet two years ago`,`Ramesh uncle, white-haired, in an apron, where he should not be`],
  eps:[
   {t:`Be There at 8`,r:[[`College`,`Day one in the hostel. The mess serves a dal that is just yellow water. Four strangers, four separate tables, four sad plates. A delivery rider gets the wrong gate and a paper bag with a clay matki lands on a bench. Four hands reach for it at once.`],[`Tonight`,`7:58 pm. Four phones buzz in four cities. Unknown number: “Be there at 8:00.” Below it, an address. Each one is the Angithi outlet nearest to that person's home. Dibya, on a group call that died in six minutes an hour ago, types: “Okay, kaun hai yeh?”`],[`Angithi in frame`,`The pot on the bench, and the address on every phone.`]],c:`The call connects. Three tiles fill up with three tired faces. The fourth tile says Kabir, and shows an old man in an apron staring into the lens: “Bahut der kar di aap logon ne.”`},
   {t:`Dal Makhani Doesn't Lie`,r:[[`College`,`They share that first matki and nobody speaks. Then Meher says, “Yeh toh ghar jaisa hai,” and Dibya starts crying into the naan. They make a rule: no phones at the table.`],[`Tonight`,`Everyone accuses Dibya of sending the message. She did not. The matkis arrive at all three outlets and the call goes quiet. Nobody has had this taste in two years.`],[`Angithi in frame`,`The silence when the lids open.`]],c:`Meher opens the sender's chat. The status reads “Table pe phone nahi.” Only one person ever said that line. Three tiles turn to Ishaan, who has gone pale: “Maine nahi bheja.”`},
   {t:`The Kitty`,r:[[`College`,`The four start a fund. Two hundred rupees each every month, kept in a steel tiffin, only for Angithi nights before exams. Ishaan is made treasurer and takes it far too seriously.`],[`Tonight`,`They laugh about the fund. Dibya asks, lightly, “Ishaan, woh kitty ka kya hua?” The laughter stops mid-breath.`],[`Angithi in frame`,`The fund exists because of the place. It is the group's shared language.`]],c:`The old man in Kabir's tile turns the camera slowly toward the counter shelf. A dented steel tiffin sits there, lid taped shut. “Yeh yahin chhod gaya tha. Kal raat tak.”`},
   {t:`Final Year`,r:[[`College`,`Placements. Meher gets an offer, Kabir does not. Dibya's scholarship is stuck and her hostel fee is due. The fund is suddenly empty. Ishaan says “khatam ho gaya.” Kabir calls him a thief. They leave the outlet without ordering, the first time ever.`],[`Tonight`,`Meher admits she has hated that night for six years, and that the hate was never about the money.`],[`Angithi in frame`,`The empty table. We hold on it for four seconds.`]],c:`Ishaan, quietly: “Main bata deta hoon paise kahan gaye. Par tum log ko achha nahi lagega ki kiske liye gaye.” Cut to black.`},
   {t:`The Man in the Apron`,r:[[`College`,`Final semester. Kabir, alone, scrubbing dishes in the back of the outlet at midnight. Ramesh uncle teaches him how to fold a roti without tearing it. Kabir never told the others because he was not going home to Ranchi, and he was ashamed.`],[`Tonight`,`Ramesh uncle answers every question except “Where is Kabir?”`],[`Angithi in frame`,`The back kitchen, a place the audience has never been.`]],c:`A kitchen door swings open in Kabir's tile. Kabir, in an apron, behind him a rolled banner. “Pehle Ishaan bolega. Phir main.”`},
   {t:`Where the Money Went`,r:[[`College`,`The fee counter, 4:55 pm, five minutes before closing. Ishaan pays Dibya's hostel fee out of the tiffin, then lies to everyone so she will never know she owes him.`],[`Tonight`,`He says it out loud. Dibya's face does not move.`],[`Angithi in frame`,`The tiffin, and the table where the lie began.`]],c:`Dibya stands up. Her matki is untouched. Her tile goes dark: “Dibya has left the call.”`},
   {t:`Opening Night`,r:[[`Tonight`,`Kabir finally explains. The banner reads “Now Open”. He put every rupee he had into running his own Angithi outlet in Lucknow, one of the new franchise outlets. It opens tonight at 8:00 and the street outside is empty. He sent the message because he could not bear to open alone. Ishaan and Meher try to call Dibya.`],[`Angithi in frame`,`It is the dream. The franchise is the plot.`]],c:`A doorbell rings in Gurugram. Ishaan opens his outlet door. Dibya is standing there, soaked, car keys in hand. She sits down across from him without a word.`},
   {t:`Same Table`,r:[[`Tonight`,`Dibya, Ishaan and the old fund, settled on one table. Kabir's first customers walk into his Lucknow outlet, strangers and a few people from the lane. Meher dials in from Dehradun and orders for all four.`],[`Angithi in frame`,`The first full-table scene. All four matkis, side by side on screen.`]],c:`Season two hook: Ramesh uncle slides an old reservation register to Kabir. The very first line, eight years ago: “Table for 1, hostel gate 3, paid in advance. Message: ‘Mess ka khaana kharab hai na? Yeh meri taraf se.’ Name: Meher's Amma.”`}
  ]
},
{
  theme:'t2',name:`Pehli Rasoi`,tag:`A new bride told the whole family she loves cooking. She meant eating. Eight episodes of a very polite crime.`,
  fmt:`Heist comedy`,drop:`1:00 pm daily`,
  intent:`Turn the kitchen into a crime scene, with the matki as the loot.`,
  role:`The secret supplier of a bride's cooking, masalas included.`,
  job:`Home delivery and the masala range.`,
  director:`Shot like a heist film in a joint-family kitchen. Fast whip-pans, a ticking clock in every episode (a guest, a mother-in-law's footstep, a pressure-cooker whistle), and a score that borrows from caper movies but played on dholak and tumbi. The kitchen is our vault and the matki is the diamond. Every delivery is planned like a robbery: the terrace, the washing-machine box, the dupatta over the pot.`,
  cast:[`Naina, Bengaluru-raised designer, three weeks married, can burn water`,`Jass, the groom, sweet, useless in the kitchen, knows more than he lets on`,`Beeji (Satwant), the mother-in-law with the legendary rajma and nose`,`Gunnu, 19, Jass's cousin, has a price for everything`,`Mausi, visits unannounced, tastes everything`,`Bunty, the rider with the best arrival timing in Delhi NCR`],
  eps:[
   {t:`Kal Se Tum Banaogi`,r:[[`Setup`,`At the pehli rasoi, Beeji announces that from tomorrow the bahu cooks every meal. Naina smiles. Her hands shake.`],[`The caper`,`Midnight. Bunty arrives at the back gate with dal makhani, still hot in its matki. Naina decants it into the family's heavy steel degchi, scrubs the clay pot, hides it behind the flour drum.`],[`Dialogue`,`“Bhaiya, bas ek baat. Kisi ko mat bolna.” / “Madam, main toh rider hoon. Rasoi ke raaz mere paas safe hain.”`],[`Angithi in frame`,`The pot, the steam, and the receipt that falls out of the bag.`]],c:`Morning. Beeji empties the kitchen dustbin, finds the receipt, reads it, folds it into her blouse pocket and says nothing.`},
   {t:`Gunnu's Price`,r:[[`Setup`,`Beeji acts as if nothing happened. That is worse. Gunnu has seen Bunty on the terrace and names his terms: a paneer tikka on every order, forever.`],[`The caper`,`Mausi is arriving tomorrow. Naina and Gunnu plan a delivery route through the washing-machine box on the roof.`],[`Dialogue`,`“Bhabhi, mujhe sab pata hai.” / “Kya pata hai?” / “Mujhe pata hai ki mujhe paneer tikka chahiye.”`],[`Angithi in frame`,`The order itself, treated as contraband.`]],c:`The family WhatsApp group buzzes. An unknown number sends a photo of Bunty on the terrace holding a matki. Gunnu stares at Naina: “Maine nahi bheja.”`},
   {t:`Mausi Ka Naak`,r:[[`Setup`,`Mausi walks in sniffing. She can tell a restaurant dal from a home dal by smell alone, she claims.`],[`The caper`,`Naina and Gunnu rub a pinch of the Angithi masala on a hot tawa so the whole house smells like a morning of cooking. It works.`],[`Dialogue`,`“Yeh toh bilkul Beeji wali khushboo hai.” / Beeji, drily: “Haan. Meri bahu ko mera swaad aata hai.”`],[`Angithi in frame`,`The masala pack, faking a childhood smell.`]],c:`Mausi takes one bite and says, “Recipe likh ke do. Main apne ghar pe banaungi.” Naina has no recipe.`},
   {t:`The Recipe`,r:[[`Setup`,`Naina writes a fake recipe full of impossible steps (“cook until it feels right”). Jass volunteers to test it at midnight.`],[`The caper`,`Her first real attempt at cooking. Smoke fills the kitchen. The alarm goes off. Neighbours gather.`],[`Dialogue`,`“Tum kyun nahi bolti ki tumhe nahi aata?” / “Kyunki tab tum mujhse shaadi nahi karte.” / “Main toh phir bhi karta.”`],[`Angithi in frame`,`The half-used masala pack by the burnt pan.`]],c:`Beeji walks through the smoke, lifts the pack, reads the label slowly, and says, “Yeh toh mera wala masala hai.”`},
   {t:`Beeji's Pantry`,r:[[`Setup`,`Beeji leads Naina to the pantry, moves a row of pickle jars and reveals a wall of the same masala packs.`],[`The twist`,`Beeji's famous masalas have always come from the same place Naina's have. Her legendary rajma was never homemade.`],[`Dialogue`,`“Tu bhi?” / “Beeji, aap bhi?”`],[`Angithi in frame`,`The hidden wall in the pantry, the source of the family's reputation.`]],c:`The pressure cooker whistles. Beeji turns it off, looks at Naina, and says, “Chal. Rasoi band karte hain. Dono.”`},
   {t:`The Pact`,r:[[`Setup`,`Two women, one kitchen, one thirty-one-year-old secret. Beeji lays out the rules: no one else is ever told, the receipts are burned, Bunty gets a Diwali bonus.`],[`Beat`,`They taste together for the first time as co-conspirators and laugh until Beeji has to sit down.`],[`Dialogue`,`“Kisi ko pata chala toh mohalla mujhe jala dega.”`],[`Angithi in frame`,`The bond between the two women.`]],c:`Jass is standing in the doorway, having heard it all. “Mujhe 31 saal jhooth khilaya?” He puts the plate down and walks out.`},
   {t:`Real Dal`,r:[[`Setup`,`Jass sulks. Naina tries to make a dal from scratch with Beeji teaching her, step by clumsy step.`],[`Beat`,`It is terrible. Jass eats it anyway, to the last grain.`],[`Dialogue`,`“Isme namak nahi hai.” / “Haan.” / “Isme kuch bhi nahi hai.” / “Haan.” / “Phir bhi achhi hai.”`],[`Angithi in frame`,`Nowhere on screen. One episode without it, so we feel it.`]],c:`The doorbell. Bunty, out of breath: “Madam, 200 logon ka order. Subah 8 baje delivery.” Nobody in the house ordered it.`},
   {t:`200 Thalis`,r:[[`Setup`,`The order is for Beeji's 60th birthday. Jass booked it so she would never have to pretend again. But the whole bradari is expecting “Beeji ke haath ka khaana.”`],[`The finale`,`Naina decides to tell the truth, in front of everyone. She lifts the first lid. Silence. Mausi takes a bite. Then one cousin, then another, quietly admits they all order too.`],[`Dialogue`,`“Hum sab ke ghar mein ek Bunty hai.”`],[`Angithi in frame`,`Two hundred matkis, a street of them.`]],c:`Season two hook: Naina's own mother arrives from Kolkata carrying a steel tiffin. “Beta, maine tere liye ghar ka khana laya hai.” She opens it. Inside is an Angithi pot.`}
  ]
},
{
  theme:'t3',name:`Galat Matki`,tag:`Every night at 9:41 pm, a matki turns up at a different door in one apartment tower. Nobody ordered it. Nobody can find out who did.`,
  fmt:`Found footage`,drop:`9:41 pm sharp`,
  intent:`A nightly ritual: the whole building waits for the bike engine at 9:40.`,
  role:`A wrong delivery that exposes everyone's secrets, and one woman's last gift.`,
  job:`Delivery orders and offer-led replays.`,
  director:`Found footage. We never use a conventional camera. Everything is a doorbell cam, a lobby CCTV frame, a screen recording of the building's WhatsApp group, or a phone held at arm's length. The audience watches like neighbours: through a peephole, a little late, always hungry for the next message. Sound is the clock. A bike engine idles outside at 9:40, and by the end of ep 2 viewers will tense when they hear it.`,
  cast:[`Kritika, 24, flat 504, works from home, first to receive a matki`,`Mr. Chaddha, 66, RWA president with a laminated rulebook`,`Mrs. Kapoor, group admin who deletes messages she dislikes`,`Tanmay, 17, builds a suspects spreadsheet in 40 minutes`,`Mahipal ji, night guard, says almost nothing`,`Sandeep, the rider who refuses to explain`],
  eps:[
   {t:`Flat 504`,r:[[`Footage`,`Doorbell cam, 9:41 pm. A rider places a bag at Kritika's door, rings, leaves. In the bag, a matki and a note: “Galat darwaza. Maaf kijiye. 2B”`],[`Chat`,`Kritika posts in “Sunrise Heights Residents (Official)”: “Anyone order Angithi? Got a wrong delivery.” Fourteen people reply no. One says, “Don't eat it.”`],[`Angithi in frame`,`The pot, and the tension of whether to open it.`]],c:`Kritika eats it. Eight minutes later the group chat shows a new message from someone who left the group an hour ago: “Kal kisi aur ka number.”`},
   {t:`The Group`,r:[[`Footage`,`The group erupts. Mr. Chaddha demands CCTV. Mrs. Kapoor deletes five messages. Tanmay starts a spreadsheet.`],[`Beat`,`Doorbell footage from three floors shows the same rider, same time, same bag. His face is always out of frame.`],[`Dialogue`,`“Yeh society ka maamla hai. Koi bhi bahar ka khaana door pe nahi chhodega.”`],[`Angithi in frame`,`The order is the mystery. Nothing else in the building matters.`]],c:`9:41 pm. The bike engine idles. Cam 1: the matki is placed at Mr. Chaddha's own door. He stares at it. He does not touch it.`},
   {t:`Chaddha's Table`,r:[[`Footage`,`Mr. Chaddha refuses to open it. He calls the police. The inspector arrives, sniffs the pot, and is asked to leave.`],[`Beat`,`At 1 am he sits alone in the corridor and opens it. It is the dish his wife used to order every anniversary. She passed away eight months ago.`],[`Dialogue`,`“Sudha ko yeh bahut pasand tha.” He says it to the empty hallway.`],[`Angithi in frame`,`The one dish that carries a marriage.`]],c:`Beneath the matki is a folded paper, written in a handwriting he knows better than his own. It reads: “Khaana thanda mat hone dena.”`},
   {t:`Operation 2B`,r:[[`Footage`,`Tanmay opens a new group, “Operation 2B”, named after the signature on the first note. Members: Kritika, a newlywed couple from 702, Mrs. Kapoor under protest. They stake out the lobby in shifts.`],[`Beat`,`Every suspect is eliminated by a different embarrassing secret. The couple were secretly eating from the same plate on the stairs. Mrs. Kapoor was never admin by election.`],[`Angithi in frame`,`The thing that makes strangers sit on a staircase at 9 pm.`]],c:`Tanmay finds the night guard's log. Every night, 9:30 to 9:50, Mahipal ji leaves the register empty. Tonight's entry is already written: “Aaj ka aakhri.”`},
   {t:`The Rider`,r:[[`Footage`,`The group blocks the gate and catches Sandeep. Phones up, torches on. He cracks within one minute.`],[`Dialogue`,`“Main sirf delivery karta hoon. Order ek hi aadmi roz deta hai. Advance paid. Poora saal.”`],[`Beat`,`“Kaun?” He points to the guard's cabin. They run.`],[`Angithi in frame`,`The delivery bag finally on screen, its sticker the only thing in frame.`]],c:`The cabin is empty. On the chair, an open register and a hand-drawn list of the building's flats, a tick beside every one that has received a matki. Only one flat is circled twice: Mr. Chaddha's. Ticked on night two, and marked again in a different ink for the last night.`},
   {t:`Sudha's List`,r:[[`Footage`,`Mahipal ji is found on the terrace, sitting with a thermos. He tells them everything.`],[`The reveal`,`Sudha ji paid for a year of dinners before she passed, and asked him to leave one outside the door of whoever looked lonely. She never told her husband, because he would have called it “fazool kharcha.”`],[`Beat`,`The whole building, one by one, lines up at the gate with their own matki. Mr. Chaddha is the last to arrive.`],[`Angithi in frame`,`The last gift of a woman who never told anyone.`]],c:`Season two hook: Mahipal ji hands Chaddha the final page of the list. Eleven nights left. And a name at the bottom nobody in the building recognises: “Rohit, Toronto.” Chaddha's estranged son.`}
  ]
},
{
  theme:'t4',name:`Mohalla Wars`,tag:`A documentary crew arrives in a small Haryana town one week before a new outlet opens. The town has other plans.`,
  fmt:`Mockumentary`,drop:`Starts 7 days before opening`,
  intent:`Show what it feels like when a town gets its own Angithi, from the inside.`,
  role:`The outlet whose opening splits a whole town, then joins it.`,
  job:`Franchise launch in new cities.`,
  director:`Mockumentary, in the spirit of the great office comedies: handheld, awkward zooms, talking heads shot against shop shutters and tractor trolleys. The crew stays off-screen but we hear their dumb questions. People forget the camera is rolling and say too much. The town is the star. The outlet is a thing that happens to them. Sound: a harmonium vamp every time someone says something scandalous.`,
  cast:[`Gill, 34, ex-corporate, put his savings into the new outlet`,`Harbans Singh, 58, owner of the town's beloved dhaba for 30 years`,`Pammi, his wife, runs the books, the family, and more than anyone knows`,`Kuldeep, 22, Harbans's nephew, sent in as a spy`,`Sarpanch ji, speaks in proverbs, none of which apply`,`Tanya, local influencer with 11,400 followers and a ring light`],
  eps:[
   {t:`Seven Days to Go`,r:[[`Documentary beat`,`Hoarding goes up on the main road. Gill gives a talking head with a trembling smile. Harbans responds by painting his own dhaba's shutter bright red.`],[`Dialogue`,`“Hum toh bas ek hoarding laga rahe hain.” / “Bas?” / “Bas.” (He looks at the crew. He is not at peace.)`],[`Angithi in frame`,`The hoarding. The whole town reads it, hates it, then quietly memorises the phone number.`]],c:`Next morning, someone has painted over the hoarding in thick black: “WAPAS JAO.” The crew turns to Harbans. He is wearing paint-stained kurta sleeves.`},
   {t:`Six Days to Go`,r:[[`Documentary beat`,`The crew investigates the vandalism like detectives. Suspects: Harbans, the sweet-shop rival, an aunt who thinks outsiders ruin dahi.`],[`The twist`,`It was not Harbans. The crew's night camera catches Pammi sneaking out to meet a courier from the next city. She is collecting Angithi masala packs to cook for her daughter's engagement.`],[`Dialogue`,`“Maine hi paint kiya tha. Kyunki mere pati ko bolna aata nahi, aur mujhe likhna aata hai.”`],[`Angithi in frame`,`She paints over the hoarding by day and orders its masalas by night.`]],c:`Pammi turns to the lens: “Yeh footage kisi ko dikhaya toh main kehti hoon main kabhi yahan thi hi nahi.” Harbans, behind her, has heard everything.`},
   {t:`Four Days to Go`,r:[[`Documentary beat`,`Harbans plans revenge. He sends Kuldeep to apply for a job at the outlet and steal the recipes.`],[`Beat`,`On day one, Kuldeep is handed a hot roti and a spoon of dal makhani straight from the matki. He closes his eyes. He forgets the mission.`],[`Dialogue`,`“Chacha, ek baat boloon? Yeh toh ghar ka khaana hai.” / “Tu spy hai, Kuldeep!” / “Haan, par ghar ka khaana hai.”`],[`Angithi in frame`,`The tasting that turns a spy.`]],c:`Kuldeep takes off the borrowed apron and puts on the real one. The camera catches Harbans watching from across the road, jaw tight.`},
   {t:`Three Days to Go`,r:[[`Documentary beat`,`The Sarpanch calls a panchayat meeting on “parking, noise, and dhaba izzat.” The meeting is a circus. Tanya streams it live.`],[`Beat`,`The Sarpanch demands a free tasting for 500 townspeople before the opening, or the permission is cancelled. Gill agrees with a very wet forehead.`],[`Angithi in frame`,`At the tasting, the entire town in one line, each person trying not to look interested.`]],c:`A man with a clipboard arrives. “Health inspection. Sabko bahar nikalo.” He tastes the dal, closes his eyes, then says, “Kitchen dikhao. Akele.” The door shuts in the crew's faces.`},
   {t:`One Day to Go`,r:[[`Documentary beat`,`The inspector is genuine and satisfied. But the supply truck is stuck in the next district with the clay pots, and the opening is tomorrow at 11.`],[`The turn`,`The old women of the town arrive with their own angithis, the clay braziers from their homes, and start a coal fire on the pavement.`],[`Dialogue`,`Sarpanch ji, solemn: “Angithi toh humare ghar ki cheez hai. Yeh naam kisi aur ko dena bekaar hai.”`],[`Angithi in frame`,`The original angithi, passed hand to hand, becomes the opening ceremony.`]],c:`Late at night the truck arrives. The driver hands over the invoice and the crew spots something: the delivery is addressed to Harbans Dhaba.`},
   {t:`Opening Day`,r:[[`Documentary beat`,`11 am. The ribbon. Gill is shaking. Harbans arrives in his best kurta with a pot of his own in his hands. The crew expects a fight.`],[`The finale`,`Harbans lifts the lid and says to the entire town, “Yeh dal mere dhaba ki hai. Aur yeh matki unki. Aaj dono ek hi thali mein milenge.” The street erupts.`],[`Dialogue`,`Gill, to the crew, off-mic: “Mujhe laga woh mujhe maar dega.” / “Aur?” / “Aur woh mujhe partner bana raha hai.”`],[`Angithi in frame`,`The first partnership between the outlet and a local dhaba. A franchise story told as a friendship.`]],c:`Season two hook: outside, a tempo arrives from the next town. A banner on the side reads: “Hamare yahan kab?” Behind it, eleven more.`}
  ]
}
]
};

function observe(){
  if(!('IntersectionObserver' in window)){$$('.rv').forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  $$('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%5)*.07+'s';io.observe(e)});
}

    const m=iv.filter(v=>langMatch(v,p)); if(!m.length) continue;
    const gm=m.filter(v=>FEM.test(v.name)===(g==='f')); const arr=gm.length?gm:m;
    return arr[(c.id.charCodeAt(0)+c.id.charCodeAt(2||0))%arr.length];
  }
  return null;
}
function textFor(c,v){ if(!v) return c.q; const l=v.lang.toLowerCase(); if(l.startsWith('pa')) return c.g||c.h||c.q; if(l.startsWith('hi')) return c.h||c.q; return c.q; }
function showCap(label,text,note){ const c=$('#cap'); c.innerHTML=`<b>${esc(label)}</b> “${esc(text)}”${note?`<small>${esc(note)}</small>`:''}`; c.classList.add('on'); clearTimeout(capT); capT=setTimeout(()=>c.classList.remove('on'),Math.max(2600,text.length*70)); }
function speak(text,o){
  o=o||{};
  return new Promise(res=>{
    const sel=o.id?`[data-ch="${o.id}"]`:null; let fin=false;
    const done=()=>{ if(fin) return; fin=true; if(sel) $$(sel).forEach(e=>e.classList.remove('talk')); duck(false); res(); };
    const noVoice=hasTTS&&soundOn&&!o.voice;
    showCap(o.label||'',o.cap||text,noVoice?'No Indian voice found on this device. Add a Hindi or English (India) voice in your system settings.':'');
    if(sel) $$(sel).forEach(e=>e.classList.add('talk'));
    if(!soundOn||!hasTTS||noVoice){ setTimeout(done,Math.max(1800,text.length*65)); return; }
    try{
      speechSynthesis.cancel(); duck(true);
      const u=new SpeechSynthesisUtterance(text.replace(/[“”"]/g,'').replace(/\s*\/\s*/g,'. '));
      u.voice=o.voice; u.lang=o.voice.lang; u.pitch=o.p||1; u.rate=o.r||1; u.volume=1; u.onend=done; u.onerror=done; speechSynthesis.speak(u);
      setTimeout(done,Math.max(5000,text.length*170));
    }catch(e){done()}
  });
}
function speakChar(i,k){ const c=CH[i][k]; const v=VOICE[c.n]||[1,1,'m']; ctx(); const vo=chooseVoice(c); return speak(textFor(c,vo),{id:c.id,label:c.n,cap:c.q,voice:vo,p:v[0],r:v[1]}); }
function narrate(text,label){ ctx(); const iv=indVoices(); const vo=iv.find(v=>/^en[-_]IN/i.test(v.lang)&&!FEM.test(v.name))||iv.find(v=>/^en[-_]IN/i.test(v.lang))||iv.find(v=>/^hi/i.test(v.lang))||null; return speak(text,{label:label||'Narrator',voice:vo,p:.85,r:.95}); }
/* voice picker: choose exactly which installed voice each character uses */
function openVoices(){
  const iv=indVoices(), sv=savedV(); const m=$('#vm');
  const opts=['<option value="">Auto (native-place accent)</option>',...iv.map(v=>`<option value="${esc(v.voiceURI||v.name)}">${esc(v.name)} · ${esc(v.lang)}</option>`)].join('');
  m.innerHTML=`<div class="vbox"><button class="vx" id="vClose" aria-label="Close">×</button><h3>Voice lab</h3>
   <p>${iv.length?`${iv.length} Indian voices found on this device. Characters use the voice closest to where they come from; pick a different one if it sounds better. Regional voices (Malayalam, Bengali, Punjabi and so on) appear only if your device has them installed.`:'No Indian voices found on this device yet. Install a Hindi or English (India) voice in your system settings, then reopen this panel.'}</p>
   <div class="vlist">${CH.map((cs,i)=>cs.map((c,k)=>`<div class="vrow"><span class="va">${av(c)}</span><div><b>${esc(c.n)}</b><small>${esc(DATA.series[i].name)} · ${esc(c.from||'')} · ${esc(c.lab||'')}</small></div><select data-vc="${c.id}">${opts}</select><button data-vt="${i}-${k}">▶</button></div>`).join('')).join('')}</div></div>`;
  m.classList.add('on');
  $$('[data-vc]',m).forEach?0:0;
  m.querySelectorAll('[data-vc]').forEach(s=>{ s.value=sv[s.dataset.vc]||''; s.onchange=()=>{const o=savedV(); if(s.value) o[s.dataset.vc]=s.value; else delete o[s.dataset.vc]; LS.set('ang_voices',JSON.stringify(o))}; });
  m.querySelectorAll('[data-vt]').forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.vt.split('-').map(Number); speakChar(i,k)});
  $('#vClose').onclick=()=>m.classList.remove('on'); m.onclick=e=>{if(e.target===m) m.classList.remove('on')};
}

function stopVoice(){ rollTok++; try{ if(hasTTS) speechSynthesis.cancel() }catch(e){} $$('.talk').forEach(e=>e.classList.remove('talk')); $('#cap').classList.remove('on'); duck(false); }
async function rollCall(i){ const tok=++rollTok; for(let k=0;k<CH[i].length;k++){ if(tok!==rollTok||openIdx!==i) return; const card=$$('.fc')[k]; if(card){card.classList.add('flip')} await speakChar(i,k); await new Promise(r=>setTimeout(r,250)); } }
function narrateEp(i,j){ const s=DATA.series[i],e=s.eps[j]; const first=(e.r[0]?e.r[0][1]:''); return narrate(`Episode ${j+1}. ${e.t}. ${first} ... Cliffhanger. ${e.c}`,'Narrator · '+s.name); }

/* ---------- audio wiring ---------- */
function syncSoundBtn(){ const b=$('#bSound'); b.textContent=soundOn?'🔊 Sound: on':'🔇 Sound: off'; b.classList.toggle('on',soundOn); }
$('#bSound').onclick=()=>{ soundOn=!soundOn; LS.set('ang_sound',soundOn?'on':'off'); if(!soundOn){ambStop();stopVoice()} else { ctx(); if(openIdx>=0) ambStart(openIdx) } syncSoundBtn(); tick(); };
$('#vol').value=vol; $('#vol').oninput=e=>{ vol=+e.target.value; LS.set('ang_vol',vol); if(MASTER) MASTER.gain.value=vol };
$('#bVoices').onclick=openVoices;
syncSoundBtn();
/* hero: click the thali for a tadka burst */
hero.addEventListener('click',e=>{
  if(e.target.closest('a,button,.pi')) return; const r=hero.getBoundingClientRect();
  sizzleS(1.5,.3); if(ctx()){thump(AC.currentTime+.05,.3,MASTER,120)}
  for(let k=0;k<22;k++){const s=document.createElement('i'); s.className='spark'; const a=Math.random()*6.283,d=60+Math.random()*150; s.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px`; hero.appendChild(s); setTimeout(()=>s.remove(),1000)}
});
$('#bRand').onclick=()=>{ ctx(); const i=Math.random()*DATA.series.length|0, j=Math.random()*DATA.series[i].eps.length|0; openSeries(i,50,50); setTimeout(()=>{ go(j); $('#ov').scrollTop=Math.max(0,$('.glider').offsetTop-80); setTimeout(()=>{cliffSting(); setTimeout(()=>narrateEp(i,j),1900)},700) },1100) };
document.addEventListener('mouseover',e=>{ if(e.target.closest&&(e.target.closest('.placard')||e.target.closest('.pi')||e.target.closest('.fc')||e.target.closest('.arrow'))) tick() });
document.addEventListener('click',e=>{
  const sv=e.target.closest&&e.target.closest('#sv'); if(!sv) return;
  const n=e.target.closest('[data-narr]'); if(n){ narrateEp(openIdx,+n.dataset.narr); return }
  const st=e.target.closest('[data-sting]'); if(st){ cliffSting(); return }
  if(e.target.closest('#bRoll')){ rollCall(openIdx); return }
  const fc=e.target.closest('.fc'); if(fc && !(editing&&e.target.closest('[contenteditable]'))){ if(fc.classList.contains('flip')) speakChar(openIdx,+fc.dataset.k); return }
  const w=e.target.closest('[data-w]'); if(w){ speakChar(openIdx,+w.dataset.w); return }
  const bg=e.target.closest('[data-big]'); if(bg){ const k=+bg.dataset.k; speakChar(openIdx,k) }
});

/* ---------- edit dock ---------- */
$('#bEdit').onclick=e=>{editing=!editing;document.body.classList.toggle('edit',editing);e.target.classList.toggle('on',editing);e.target.textContent=editing?'✓ Done editing':'✎ Edit mode';applyEditable()};
$('#fLogo').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{LS.set('ang_logo',r.result);renderLogo()}; r.readAsDataURL(f)};
$('#bLogoX').onclick=()=>{LS.del('ang_logo');renderLogo()};
function applyCols(c){const r=document.documentElement.style; if(c.c1)r.setProperty('--ember',c.c1); if(c.c2)r.setProperty('--gold',c.c2); if(c.c3)r.setProperty('--bg',c.c3)}
['c1','c2','c3'].forEach(id=>$('#'+id).oninput=()=>{const c={c1:$('#c1').value,c2:$('#c2').value,c3:$('#c3').value};applyCols(c);LS.set('ang_cols',JSON.stringify(c))});
try{const c=JSON.parse(LS.get('ang_cols')||'null'); if(c){applyCols(c);$('#c1').value=c.c1;$('#c2').value=c.c2;$('#c3').value=c.c3}}catch(e){}
$('#bReset').onclick=()=>{if(confirm('Reset every edit, logo and colour back to the original?')){['ang_data','ang_logo','ang_cols'].forEach(LS.del);location.reload()}};
$('#bSave').onclick=()=>{
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#seed-script').textContent='\nconst SEED = '+JSON.stringify(DATA).replace(/</g,'\\u003c')+';\n';
  ['#mq','#goals','#rules','#placards','#rel','#sv','#decor','#logoBox','#parade','#thD','#thLi'].forEach(s=>{const n=c.querySelector(s); if(n) n.innerHTML=''});
  c.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));
  c.querySelectorAll('[data-p]').forEach(n=>{ if(!n.closest('#ov')) n.textContent=''});
  c.querySelector('body').classList.remove('edit'); c.querySelector('body').style.overflow='';
  const logo=LS.get('ang_logo'); const cols=LS.get('ang_cols');
  const st=document.createElement('script'); st.textContent=`try{${logo?`localStorage.setItem('ang_logo',${JSON.stringify(logo)});`:''}${cols?`localStorage.setItem('ang_cols',${JSON.stringify(cols)});`:''}localStorage.removeItem('ang_data')}catch(e){}`;
  c.querySelector('#seed-script').after(st);
  const blob=new Blob(['<!doctype html>\n'+c.outerHTML],{type:'text/html'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Punjabi_Angithi_Micro_Drama_Pitch_edited.html'; a.click();
};
renderLogo(); renderHome(); bind();
})();
</script>
